<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FOODIFY</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
      }
      input {
        width: 80%;
        padding: 10px;
        margin-right: 10px;
        margin-bottom: 10px;
      }
      button {
        padding: 10px 20px;
        margin-right: 5px;
        cursor: pointer;
      }
      .btn-spicy {
        background-color: #ff4500;
        color: white;
        border: none;
        border-radius: 4px;
        display: inline-block;
        filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
        transition: background-color 0.3s ease;
      }
      .btn-random {
        background-color: #130367;
        color: white;
        border: none;
        border-radius: 4px;
        display: inline-block;
        filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
        transition: background-color 0.3s ease;
      }
      .btn-spicy:hover {
        background-color: rgb(89, 1, 1);
      }
      .btn-random:hover {
        background-color: rgb(10, 1, 61);
      }
      .btn-sweet {
        background-color: #ff69b4;
        color: white;
        border: none;
        border-radius: 4px;
        display: inline-block;
        filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
        transition: background-color 0.3s ease;
      }
      .btn-sweet:hover {
        background-color: rgb(89, 1, 70);
      }
      .btn-savory {
        background-color: #8b4513;
        color: white;
        border: none;
        border-radius: 4px;
        display: inline-block;
        filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
        transition: background-color 0.3s ease;
      }
      .btn-savory:hover {
        background-color: rgb(71, 3, 1);
      }
      .btn-italian {
        background-color: rgb(223, 243, 5);
        color: white;
        border: none;
        border-radius: 4px;
        display: inline-block;
        filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
        transition: background-color 0.3s ease;
      }
      .btn-italian:hover {
        background-color: rgb(131, 131, 2);
      }
      .btn-french {
        background-color: rgb(70, 130, 180);
        color: white;
        border: none;
        border-radius: 4px;
        display: inline-block;
        filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
        transition: background-color 0.3s ease;
      }
      .btn-french:hover {
        background-color: rgb(10, 1, 96);
      }
      .btn-mexican {
        background-color: rgb(3, 125, 9);
        color: white;
        border: none;
        border-radius: 4px;
        display: inline-block;
        filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
        transition: background-color 0.3s ease;
      }
      .btn-mexican:hover {
        background-color: rgb(1, 61, 1);
      }
      .btn-thai {
        background-color: rgb(255, 165, 0);
        color: white;
        border: none;
        border-radius: 4px;
        display: inline-block;
        filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
        transition: background-color 0.3s ease;
      }
      .btn-thai:hover {
        background-color: rgb(131, 101, 2);
      }
      .btn-japanese {
        background-color: rgb(139, 69, 19);
        color: white;
        border: none;
        border-radius: 4px;
        display: inline-block;
        filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
        transition: background-color 0.3s ease;
      }
      .btn-japanese:hover {
        background-color: rgb(71, 3, 1);
      }
      .btn-sour {
        background-color: rgb(242, 255, 0);
        color: white;
        border: none;
        border-radius: 4px;
        display: inline-block;
        filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
        transition: background-color 0.3s ease;
      }
      .btn-sour:hover {
        background-color: rgb(80, 89, 1);
      }
      .btn-spicy.selected {
        background-color: rgb(150, 50, 50);
      }
      .btn-random.selected {
        background-color: rgb(60, 50, 150);
      }
      .btn-sweet.selected {
        background-color: rgb(150, 100, 130);
      }
      .btn-savory.selected {
        background-color: rgb(140, 80, 50);
      }
      .btn-italian.selected {
        background-color: rgb(180, 180, 80);
      }
      .btn-french.selected {
        background-color: rgb(100, 150, 200);
      }
      .btn-mexican.selected {
        background-color: rgb(50, 150, 80);
      }
      .btn-thai.selected {
        background-color: rgb(220, 150, 100);
      }
      .btn-japanese.selected {
        background-color: rgb(150, 100, 80);
      }
      .btn-sour.selected {
        background-color: rgb(180, 180, 100);
      }
      .toggle-btn.selected {
        outline: 3px solid rgba(0, 0, 0, 0.15);
        transform: translateY(-2px);
        opacity: 0.8;
      }
      .button-container {
        background:
          linear-gradient(rgb(60, 60, 61), rgb(60, 60, 61)) padding-box,
          linear-gradient(135deg, rgba(238, 255, 0, 0.5), rgba(255, 21, 0, 0.5))
            border-box;
        border: 2px solid transparent;
        border-radius: 20px;
        padding: 20px;
        margin: 15px 0;
      }
      .button-container2 {
        background:
          linear-gradient(rgb(60, 60, 61), rgb(60, 60, 61)) padding-box,
          linear-gradient(135deg, rgba(238, 255, 0, 0.5), rgba(255, 21, 0, 0.5))
            border-box;
        border: 2px solid transparent;
        border-radius: 20px;
        padding: 20px;
        margin: 15px 0;
      }
      #output {
        padding: 15px;
        background: #2912d5;
        border-radius: 5px;
        margin-top: 20px;
        min-height: 100px;
      }
    </style>
  </head>
  <body style="background-color: rgb(17, 17, 18)">
    <h1
      style="
        color: transparent;
        text-align: center;
        background: linear-gradient(90deg, rgb(238, 255, 0), rgb(255, 21, 0));
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      "
    >
      FOODIFY
    </h1>

    <div class="button-container">
      <h2
        style="
          color: transparent;
          text-align: center;
          background: linear-gradient(90deg, rgb(238, 255, 0), rgb(255, 21, 0));
          background-clip: text;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        "
      >
        Pick your taste
      </h2>
      <br />
      <button
        id="spicyBtn"
        class="btn-spicy toggle-btn"
        data-prompt="Give me a list of good spicy food recommendations with a brief description for each."
      >
        🌶️ Spicy
      </button>
      <button
        id="sweetBtn"
        class="btn-sweet toggle-btn"
        data-prompt="Give me a list of good sweet food recommendations with a brief description for each."
      >
        🍬 Sweet
      </button>
      <button
        id="savoryBtn"
        class="btn-savory toggle-btn"
        data-prompt="Give me a list of good savory food recommendations with a brief description for each."
      >
        🍖 Savory
      </button>
      <button
        id="sourBtn"
        class="btn-sour toggle-btn"
        data-prompt="Give me a list of good sour food recommendations with a brief description for each."
      >
        🍋 Sour
      </button>
      <button
        id="randomBtn"
        class="btn-random toggle-btn"
        data-prompt="Give me 1  random food recommendation with a brief description for each."
      >
        🎲 Random
      </button>
      <br />
    </div>
    <br />

    <div class="button-container2">
      <h2
        style="
          color: transparent;
          text-align: center;
          background: linear-gradient(90deg, rgb(238, 255, 0), rgb(255, 21, 0));
          background-clip: text;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        "
      >
        Pick your cuisine
      </h2>
      <br />
      <button
        id="italianBtn"
        class="btn-italian toggle-btn"
        data-prompt="make it italian food"
      >
        🍕Italian
      </button>
      <button
        id="mexicanBtn"
        class="btn-mexican toggle-btn"
        data-prompt="make it mexican food"
      >
        🌮Mexican
      </button>
      <button
        id="frenchBtn"
        class="btn-french toggle-btn"
        data-prompt="make it french food"
      >
        🥐French
      </button>
      <button
        id="thaiBtn"
        class="btn-thai toggle-btn"
        data-prompt="make it thai food"
      >
        🍜Thai
      </button>
      <button
        id="japaneseBtn"
        class="btn-japanese toggle-btn"
        data-prompt="make it japanese food"
      >
        🍣Japanese
      </button>
    </div>
    <input
      style="
        border: none;
        background-color: rgb(226, 237, 242);
        text-align: center;
        color: #16036a;
      "
      type="text"
      id="userInput"
      placeholder="Ask something..."
    />
    <button
      style="
        background-color: #130367;
        color: rgb(19, 162, 210);
        border: none;
        border-radius: 4px;
        padding: 10px 20px;
        margin-right: 5px;
        cursor: pointer;
      "
      id="askBtn"
    >
      Submit
    </button>

    <div
      id="output"
      style="
        background-color: rgb(212, 222, 230);
        color: #16036a;
        font-family: sans-serif;
        text-align: center;
        align-self: center;
      "
    >
      reccomendations will appear here...
    </div>

    <script>
      // Central function to handle sending text to your Node.js backend
      async function searchAI(promptText) {
        const outputDiv = document.getElementById("output");
        if (!promptText) return alert("Please enter a prompt");
        outputDiv.innerText = "getting your reccomendations...";

        try {
          const response = await fetch("http://localhost:3000/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: promptText }),
          });

          const data = await response.json();
          if (data.reply) {
            outputDiv.innerText = data.reply;
          } else {
            outputDiv.innerText = "Error: " + (data.error || "Unknown error");
          }
        } catch (error) {
          outputDiv.innerText = "Could not connect to server.";
          console.error(error);
        }
      }

      // Toggle behavior for category buttons (allow multiple selection)
      document.querySelectorAll(".toggle-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.currentTarget.classList.toggle("selected");
        });
      });

      // Build prompt from selected categories and custom input, then submit
      document.getElementById("askBtn").addEventListener("click", () => {
        const userText = document.getElementById("userInput").value.trim();
        const selected = Array.from(
          document.querySelectorAll(".toggle-btn.selected"),
        );

        let prompts = selected.map((b) => b.dataset.prompt);

        // If user entered custom text, prefer that as the main prompt
        if (userText) {
          // If categories are selected, append them as context
          if (prompts.length) {
            const combined = userText + "\n\nContext: " + prompts.join(" \n");
            searchAI(combined);
          } else {
            searchAI(userText);
          }
          return;
        }

        // No user text — use selected categories only
        if (prompts.length === 0) {
          return alert(
            "Please enter a prompt or select at least one category.",
          );
        }

        // Combine selected category prompts into one request
        const combinedPrompt = prompts.join(" \n");
        searchAI(combinedPrompt);
      });

      // Optional: allow Enter key in input to trigger Submit
      document.getElementById("userInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          document.getElementById("askBtn").click();
        }
      });
    </script>
  </body>
</html>
