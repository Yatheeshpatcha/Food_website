<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FOODIFY</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    input { width: 80%; padding: 10px; margin-right: 10px; margin-bottom: 10px; }
    button { padding: 10px 20px; margin-right: 5px; cursor: pointer; }
    .btn-spicy { background-color: #ff4500; color: white; border: none; border-radius: 4px; }
    .btn-random { background-color: #130367; color: white; border: none; border-radius: 4px; }
    .btn-sweet { background-color: #ff69b4; color: white; border: none; border-radius: 4px; }
    .btn-savory { background-color: #8b4513; color: white; border: none; border-radius: 4px; }
    .btn-italian { background-color: rgb(223, 243, 5); color: white; border: none; border-radius: 4px; }
    .toggle-btn.selected { outline: 3px solid rgba(0,0,0,0.15); transform: translateY(-2px); }
    .modifier-btn { box-shadow: inset 0 -3px rgba(0,0,0,0.08); }
    .modifier-btn.selected { outline: 3px dashed rgba(0,0,0,0.18); }
    #output {  padding: 15px; background: #2912d5; border-radius: 5px; margin-top: 20px; min-height: 100px; }
  </style>
</head>
<body style="background-color: rgb(17, 17, 18);">

  <h1 style="color: rgb(58, 6, 244); text-align: center;">FOODIFY</h1>
  <input style=" border: none; background-color: rgb(226, 237, 242); text-align: center; color: #16036a;" type="text" id="userInput" placeholder="Ask something...">
  <br>

<button id="spicyBtn" class="btn-spicy toggle-btn" data-category="spicy">🌶️ Spicy</button>
  <button id="sweetBtn" class="btn-sweet toggle-btn" data-category="sweet">🍬 Sweet</button>
  <button id="savoryBtn" class="btn-savory toggle-btn" data-category="savory">🍖 Savory</button>
  <button id="randomBtn" class="btn-random toggle-btn" data-category="random">🎲 Random</button>
  <button id="italianBtn" class="btn-italian modifier-btn toggle-btn" data-modifier="italian">🍕 Italian</button>
  <br>
  <button style="background-color: #130367; color: rgb(19, 162, 210); border: none; border-radius: 4px; padding: 10px 20px; margin-right: 5px; cursor: pointer;" id="askBtn">Submit</button>

  <div id="output" style="background-color: rgb(212, 222, 230); color: #16036a; font-family: sans-serif; text-align: center; align-self: center;">reccomendations will appear here...</div>

  <script>
    // Central function to handle sending text to your Node.js backend
    async function searchAI(promptText) {
      const outputDiv = document.getElementById('output');
      if (!promptText) return alert('Please enter a prompt');
      outputDiv.innerText = 'getting your reccomendations...';

      try {
        const response = await fetch('http://localhost:3000/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText })
        });

        const data = await response.json();
        if (data.reply) {
          outputDiv.innerText = data.reply;
        } else {
          outputDiv.innerText = 'Error: ' + (data.error || 'Unknown error');
        }
      } catch (error) {
        outputDiv.innerText = 'Could not connect to server.';
        console.error(error);
      }
    }

    // Toggle behavior for category and modifier buttons (allow multiple selection)
    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.currentTarget.classList.toggle('selected');
      });
    });

    // Build prompt from selected categories and custom input, then submit
    document.getElementById('askBtn').addEventListener('click', () => {
      const userText = document.getElementById('userInput').value.trim();
      const selected = Array.from(document.querySelectorAll('.toggle-btn.selected'));

      // Separate categories and modifiers
      const categories = selected.map(b => b.dataset.category).filter(Boolean);
      const modifiers = selected.map(b => b.dataset.modifier).filter(Boolean);
      const modifierText = modifiers.length ? modifiers.join(' ') : '';

      function buildPromptForCategory(cat) {
        const mod = modifierText ? ' ' + modifierText.charAt(0).toUpperCase() + modifierText.slice(1) : '';
        if (cat === 'random') {
          return `Give me a list of random${mod} food recommendations with a brief description for each.`;
        }
        return `Give me a list of good ${cat}${mod} food recommendations with a brief description for each.`;
      }

      // If user entered custom text, prefer that as the main prompt
      if (userText) {
        if (categories.length) {
          const contextPrompts = categories.map(c => buildPromptForCategory(c));
          const combined = userText + '\n\nContext: ' + contextPrompts.join(' \n');
          searchAI(combined);
        } else {
          searchAI(userText);
        }
        return;
      }

      // No user text — use selected categories only
      if (categories.length === 0) {
        return alert('Please enter a prompt or select at least one category.');
      }

      const combinedPrompt = categories.map(c => buildPromptForCategory(c)).join(' \n');
      searchAI(combinedPrompt);
    });

    // Optional: allow Enter key in input to trigger Submit
    document.getElementById('userInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('askBtn').click();
      }
    });
  </script>

</body>
</html>
